name: Weekly Digest

on:
  schedule:
    # 매주 목요일 22:00 UTC = 금요일 07:00 KST
    - cron: "0 22 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "energy-asset-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Generate weekly digest
        run: python src/run_weekly_digest.py
